<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510"><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486581"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="38" font-size="25" fill="#172b4d">Philips I2S boundary timing and sample buffering</text><text x="35" y="95" font-size="19" fill="#172b4d">TX prepares DATA/WS on BCLK falling edges; receiver samples on rising edges.</text><rect x="35" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="49" y="183" font-size="20" fill="#172b4d">index 15</text><text x="49" y="208" font-size="15" fill="#172b4d">old left LSB; WS -&gt; 1</text><text x="49" y="231" font-size="15" fill="#172b4d">next BCLK rise still reads left LSB</text><path d="M315,205 L345,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="345" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="359" y="183" font-size="20" fill="#172b4d">index 16</text><text x="359" y="208" font-size="15" fill="#172b4d">right MSB; WS = 1</text><text x="359" y="231" font-size="15" fill="#172b4d">right word begins one bit later</text><path d="M625,205 L655,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="655" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="669" y="183" font-size="20" fill="#172b4d">index 31</text><text x="669" y="208" font-size="15" fill="#172b4d">old right LSB; WS -&gt; 0</text><text x="669" y="231" font-size="15" fill="#172b4d">load NEW frame from OLD pending</text><path d="M935,205 L965,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="965" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="979" y="183" font-size="20" fill="#172b4d">index 0</text><text x="979" y="208" font-size="15" fill="#172b4d">new left MSB; WS = 0</text><text x="979" y="231" font-size="15" fill="#172b4d">left word begins one bit later</text><text x="35" y="335" font-size="19" fill="#172b4d">Each channel: 16 MSB-first bits; stereo pair: 32 BCLK periods = 576 clk cycles.</text><text x="35" y="380" font-size="19" fill="#172b4d">A PCM arriving at frame_load is kept for the NEXT load; no same-edge bypass.</text><text x="30" y="492" font-size="13" fill="#526777">Source: real RTL + integration assertions; schematic, not a captured waveform.</text></g></svg>
