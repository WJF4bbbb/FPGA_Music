<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510"><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486581"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="38" font-size="25" fill="#172b4d">Real system signal flow</text><rect x="30" y="90" width="250" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="44" y="118" font-size="20" fill="#172b4d">sensor_frontend</text><text x="44" y="143" font-size="15" fill="#172b4d">key_raw[7:0] -&gt; key_state</text><text x="44" y="166" font-size="15" fill="#172b4d">2 sync + 5400 filter clocks</text><rect x="345" y="90" width="250" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="359" y="118" font-size="20" fill="#172b4d">note_event</text><text x="359" y="143" font-size="15" fill="#172b4d">32-entry FIFO; MIDI map</text><text x="359" y="166" font-size="15" fill="#172b4d">release first, then key order</text><rect x="660" y="90" width="250" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="674" y="118" font-size="20" fill="#172b4d">top event mux</text><text x="674" y="143" font-size="15" fill="#172b4d">normal / test_mode</text><text x="674" y="166" font-size="15" fill="#172b4d">valid + ready handshake</text><rect x="975" y="90" width="250" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="989" y="118" font-size="20" fill="#172b4d">voice_alloc</text><text x="989" y="143" font-size="15" fill="#172b4d">4 voices; key identity</text><text x="989" y="166" font-size="15" fill="#172b4d">retrigger / steal / release</text><path d="M280,140 L345,140" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><path d="M595,140 L660,140" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><path d="M910,140 L975,140" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><path d="M1100,190 L1100,275" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="975" y="275" width="250" height="100" rx="10" fill="#e6f5ec" stroke="#7793b3"/><text x="989" y="303" font-size="20" fill="#172b4d">osc x4 + sin_rom</text><text x="989" y="328" font-size="15" fill="#172b4d">independent DDS phase</text><text x="989" y="351" font-size="15" fill="#172b4d">signed wave[15:0]</text><rect x="660" y="275" width="250" height="100" rx="10" fill="#e6f5ec" stroke="#7793b3"/><text x="674" y="303" font-size="20" fill="#172b4d">adsr x4</text><text x="674" y="328" font-size="15" fill="#172b4d">cached trigger + frame gate</text><text x="674" y="351" font-size="15" fill="#172b4d">signed sample[15:0]</text><rect x="345" y="275" width="250" height="100" rx="10" fill="#e6f5ec" stroke="#7793b3"/><text x="359" y="303" font-size="20" fill="#172b4d">mixer</text><text x="359" y="328" font-size="15" fill="#172b4d">signed sum &gt;&gt;2; gain/65536</text><text x="359" y="351" font-size="15" fill="#172b4d">complete frame only</text><rect x="30" y="275" width="250" height="100" rx="10" fill="#e6f5ec" stroke="#7793b3"/><text x="44" y="303" font-size="20" fill="#172b4d">i2s_tx</text><text x="44" y="328" font-size="15" fill="#172b4d">pending -&gt; frame buffer</text><text x="44" y="351" font-size="15" fill="#172b4d">mono PCM copied to L/R</text><path d="M975,325 L910,325" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><path d="M660,325 L595,325" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><path d="M345,325 L280,325" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><text x="30" y="435" font-size="19" fill="#172b4d">audio_timing: 27 MHz -&gt; BCLK 1.5 MHz; frame_tick/frame_load every 576 clocks</text><text x="30" y="492" font-size="13" fill="#526777">Source: real RTL + integration assertions; schematic, not a captured waveform.</text></g></svg>
