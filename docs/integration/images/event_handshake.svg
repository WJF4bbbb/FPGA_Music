<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510"><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#486581"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="30" y="38" font-size="25" fill="#172b4d">Note event handshake and NBA timing</text><text x="35" y="95" font-size="19" fill="#172b4d">At each clk rising edge, pre-edge valid &amp;&amp; ready consumes exactly one payload.</text><rect x="35" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="49" y="183" font-size="20" fill="#172b4d">E0: sensor updates</text><text x="49" y="208" font-size="15" fill="#172b4d">key_state registers new mask</text><text x="49" y="231" font-size="15" fill="#172b4d">note_event still reads old mask</text><path d="M315,205 L345,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="345" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="359" y="183" font-size="20" fill="#172b4d">E1: FIFO enqueues</text><text x="359" y="208" font-size="15" fill="#172b4d">release events, then press events</text><text x="359" y="231" font-size="15" fill="#172b4d">evt_valid/payload become visible</text><path d="M625,205 L655,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="655" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="669" y="183" font-size="20" fill="#172b4d">E2: allocation</text><text x="669" y="208" font-size="15" fill="#172b4d">voice_alloc reads stable FIFO head</text><text x="669" y="231" font-size="15" fill="#172b4d">gate and trigger update after NBA</text><path d="M935,205 L965,205" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#tip)"/><rect x="965" y="155" width="280" height="100" rx="10" fill="#e8f1ff" stroke="#7793b3"/><text x="979" y="183" font-size="20" fill="#172b4d">E3: trigger cache</text><text x="979" y="208" font-size="15" fill="#172b4d">next FIFO entry transfers if present</text><text x="979" y="231" font-size="15" fill="#172b4d">ADSR remembers one-clock trigger</text><text x="35" y="330" font-size="20" fill="#172b4d">When ready=0: valid and the entire key_id/note/on tuple must remain stable.</text><text x="35" y="375" font-size="18" fill="#172b4d">Real top allocator is always ready; demo isolates the real source with ready=0.</text><text x="30" y="492" font-size="13" fill="#526777">Source: real RTL + integration assertions; schematic, not a captured waveform.</text></g></svg>
