<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPGA 合成器 · 蓝牙桥接</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2c313a;
    --text: #e8eaed;
    --dim: #8b93a1;
    --accent: #4a9eff;
    --ok: #3ddc97;
    --warn: #ffb020;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 500; }
  #status {
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    background: #2a2e37; color: var(--dim);
  }
  #status.on  { background: rgba(61,220,151,.15); color: var(--ok); }
  #status.err { background: rgba(255,92,92,.15);  color: var(--err); }
  header .spacer { flex: 1; }
  button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: #262b34; color: var(--text); font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #3d8ae0; color: #fff; }
  main {
    display: grid; grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
    gap: 16px; padding: 16px 20px; align-items: start;
  }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  section > h2 {
    margin: 0 0 14px; font-size: 13px; font-weight: 500; color: var(--dim);
    letter-spacing: .04em;
  }
  .placeholder { color: var(--dim); font-size: 13px; padding: 24px 0; text-align: center; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <h1>FPGA 合成器</h1>
  <span id="status">未连接</span>
  <span class="spacer"></span>
  <button id="btnRelease" disabled>交还触摸板</button>
  <button id="btnConnect" class="primary">连接蓝牙（桥接）</button>
</header>

<main>
  <section id="inputPanel">
    <h2>虚拟输入</h2>
    <div class="placeholder">等待 js/input.js 渲染</div>
  </section>

  <section id="displayPanel">
    <h2>实时状态</h2>
    <div class="placeholder">等待 js/display.js 渲染</div>
  </section>
</main>

<script src="js/bridge_serial.js"></script>
<script src="js/input.js"></script>
<script src="js/display.js"></script>
</body>
</html>
